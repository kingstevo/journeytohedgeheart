<!DOCTYPE html>
<html>

<head>
    <!-- This page lives in /3d/ but shares the game files and assets in the site root -->
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#87CEEB">
    <title>Journey to Hedgeheart 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Heads-up display drawn in HTML on top of the 3D canvas */
        #game-container { touch-action: none; }

        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
            user-select: none;
            -webkit-user-select: none;
        }

        /* The countdown, shown as a scoreboard */
        #hud-scoreboard {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            padding: 6px;
            background: rgba(16, 20, 54, 0.55);
            border-radius: 14px;
            text-shadow: none;
        }

        #hud-scoreboard div {
            min-width: 58px;
            padding: 4px 6px 5px;
            text-align: center;
            background: #141a45;
            border-radius: 9px;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        #hud-scoreboard b {
            display: block;
            font-size: 30px;
            line-height: 1.1;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        #hud-scoreboard span {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #7fd8ff;
        }

        #hud-text {
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 16px;
        }

        #hud-message {
            font-size: 20px;
        }

        #hud-best {
            font-size: 16px;
            color: #ffdd00;
        }

        @media (max-width: 420px) {
            #hud-scoreboard div { min-width: 48px; }
            #hud-scoreboard b { font-size: 24px; }
        }

        #hud-button {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            min-width: 200px;
            height: 80px;
            padding: 0 28px;
            font: 26px "Nunito", sans-serif;
            color: #fff;
            background: rgba(34, 34, 34, 0.3);
            border: 6px solid rgba(136, 136, 136, 0.5);
            border-radius: 40px;
            cursor: pointer;
            pointer-events: auto;
            transition: opacity 0.5s linear;
        }

        #hud-button.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="headerContent">
            <img src="assets/hedgefavicon.png" alt="Journey to Hedgeheart logo" class="headerImage">
            <h1>Journey to Hedgeheart 3D</h1>
        </div>
        <p>The hedgehog runs straight for Hedgeheart! Left and right to change lanes, up to jump, or swipe.</p>

        <div id="game-container">
            <div id="hud">
                <div id="hud-scoreboard" aria-label="Time to Hedgeheart">
                    <div><b>0</b><span>days</span></div>
                    <div><b>00</b><span>hrs</span></div>
                    <div><b>00</b><span>min</span></div>
                    <div><b>00</b><span>sec</span></div>
                </div>
                <div id="hud-text">
                    <div id="hud-best"></div>
                    <div id="hud-message"></div>
                </div>
                <button id="hud-button">Start game?</button>
            </div>
        </div>

        <div class="mobile-controls">
            <button id="left-btn">◀</button>
            <button id="jump-btn">▲</button>
            <button id="right-btn">▶</button>
        </div>
    </div>

    <script type="module" src="platformer_v5.js"></script>
</body>

</html>
