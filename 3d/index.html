<!DOCTYPE html>
<html>

<head>
    <!-- This page lives in /3d/ but shares the game files and assets in the site root -->
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#87CEEB">
    <title>Journey to Hedgeheart 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* The game fills the whole window; everything else floats on top of it */
        #game-container {
            position: fixed;
            inset: 0;
            touch-action: none;
        }

        /* On touch screens the buttons sit over the bottom of the scene */
        .mobile-controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2;
        }

        /* The title: a banner floating in the middle of the scene, which
           shrinks into the top left corner when the game starts */
        #hud-banner {
            position: absolute;
            left: 50%;
            top: 27%;
            transform: translate(-50%, -50%) scale(1);
            transform-origin: 0 0;
            transition: left 0.8s, top 0.8s, transform 0.8s;
            transition-timing-function: cubic-bezier(0.6, 0, 0.2, 1);
            text-shadow: none;
        }

        #hud-banner.small {
            left: 14px;
            top: 12px;
            transform: translate(0, 0) scale(0.44);
        }

        .banner-float {
            display: flex;
            align-items: center;
            gap: 22px;
            perspective: 500px;
            animation: banner-float 3.2s ease-in-out infinite;
        }

        #hud-banner.small .banner-float {
            animation: none;
        }

        @keyframes banner-float {
            0%, 100% { transform: translateY(-7px); }
            50% { transform: translateY(7px); }
        }

        #hud-banner h1 {
            margin: 0;
            padding: 0;
            border: none;
            max-width: 600px;
            font-size: clamp(30px, 6.5vw, 58px);
            font-weight: 800;
            line-height: 1.05;
            white-space: nowrap;
            color: #fff;
            text-shadow:
                0 1px 0 #cfe9f5, 0 2px 0 #a9d3e6, 0 3px 0 #7fb6cf, 0 4px 0 #5a97b3,
                0 5px 0 #3f7a96, 0 12px 14px rgba(0, 0, 0, 0.35);
            transition: opacity 0.5s, max-width 0.8s;
        }

        /* The logo as a chip with real thickness: a stack of layers that swings to show its edge */
        .logo-chip {
            position: relative;
            flex: none;
            width: 96px;
            height: 96px;
            transform-style: preserve-3d;
            animation: chip-swing 4s ease-in-out infinite;
        }

        .logo-chip i,
        .logo-chip img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 21%;
        }

        .logo-chip i { background: #0e86a8; }
        .logo-chip i:nth-child(1) { transform: translateZ(-7px); background: #0a6682; box-shadow: 0 16px 18px rgba(0, 0, 0, 0.4); }
        .logo-chip i:nth-child(2) { transform: translateZ(-5px); }
        .logo-chip i:nth-child(3) { transform: translateZ(-3px); }
        .logo-chip i:nth-child(4) { transform: translateZ(-1px); }
        .logo-chip i:nth-child(5) { transform: translateZ(1px); }
        .logo-chip i:nth-child(6) { transform: translateZ(3px); }
        .logo-chip i:nth-child(7) { transform: translateZ(5px); background: #12b5e0; }
        .logo-chip img { transform: translateZ(7px) scale(0.9); }

        @keyframes chip-swing {
            0%, 100% { transform: rotateX(8deg) rotateY(-30deg); }
            50% { transform: rotateX(8deg) rotateY(30deg); }
        }

        /* Next to the scoreboard there is only room for the chip on narrower screens */
        @media (max-width: 1000px) {
            #hud-banner.small h1 {
                opacity: 0;
                max-width: 0;
            }
        }

        @media (max-width: 640px) {
            .banner-float {
                flex-direction: column;
                gap: 14px;
            }

            #hud-banner.small .banner-float { align-items: flex-start; }
        }

        @media (pointer: coarse) {
            #hud-text { bottom: 116px !important; }
        }

        /* Heads-up display drawn in HTML on top of the 3D canvas */

        #hud {
            position: absolute;
            inset: 0;
            pointer-events: none;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
            user-select: none;
            -webkit-user-select: none;
        }

        /* The countdown: a scoreboard hung from the top of the screen, tilted
           back a little, with raised tiles like a flip clock */
        #hud-scoreboard {
            position: absolute;
            top: 14px;
            left: 50%;
            display: flex;
            gap: 7px;
            padding: 8px 9px 12px;
            background: linear-gradient(#3a4387, #262d63);
            border-radius: 16px;
            text-shadow: none;
            transform: translateX(-50%) perspective(420px) rotateX(16deg);
            transform-origin: 50% 0;
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.28),
                0 3px 0 #1c2250, 0 6px 0 #171c44, 0 9px 0 #121638,
                0 20px 22px rgba(0, 0, 0, 0.4);
        }

        #hud-scoreboard div {
            position: relative;
            min-width: 58px;
            padding: 5px 6px 6px;
            text-align: center;
            background: linear-gradient(#232b68 0, #1a2052 49%, #0d1236 51%, #141a45 100%);
            border-radius: 9px;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.22),
                0 2px 0 #090c26, 0 4px 0 #06081c,
                0 7px 8px rgba(0, 0, 0, 0.45);
        }

        #hud-scoreboard b {
            display: block;
            font-size: 30px;
            line-height: 1.1;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6), 0 0 12px rgba(127, 216, 255, 0.35);
        }

        #hud-scoreboard span {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #7fd8ff;
        }

        #hud-mute {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 18px;
            line-height: 40px;
            background: rgba(20, 26, 69, 0.6);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            pointer-events: auto;
        }

        /* A white flash when the hedgehog is hit */
        #hud-flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
        }

        #hud-flash.on {
            animation: hud-flash 0.35s ease-out;
        }

        @keyframes hud-flash {
            from { opacity: 0.65; }
            to { opacity: 0; }
        }

        #hud-text {
            position: absolute;
            left: 20px;
            right: 20px;
            bottom: 16px;
        }

        #hud-message {
            font-size: 20px;
        }

        #hud-best {
            font-size: 16px;
            color: #ffdd00;
        }

        @media (max-width: 420px) {
            #hud-scoreboard div { min-width: 48px; }
            #hud-scoreboard b { font-size: 24px; }
        }

        #hud-button {
            position: absolute;
            left: 50%;
            top: 56%;
            transform: translate(-50%, -50%);
            min-width: 200px;
            white-space: nowrap;
            height: 80px;
            padding: 0 28px;
            font: 26px "Nunito", sans-serif;
            color: #fff;
            background: rgba(34, 34, 34, 0.3);
            border: 6px solid rgba(136, 136, 136, 0.5);
            border-radius: 40px;
            cursor: pointer;
            pointer-events: auto;
            transition: opacity 0.5s linear;
        }

        #hud-button.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div id="hud">
            <div id="hud-flash"></div>
            <div id="hud-scoreboard" aria-label="Time to Hedgeheart">
                <div><b>0</b><span>days</span></div>
                <div><b>00</b><span>hrs</span></div>
                <div><b>00</b><span>min</span></div>
                <div><b>00</b><span>sec</span></div>
            </div>
            <div id="hud-banner">
                <div class="banner-float">
                    <div class="logo-chip">
                        <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
                        <img src="assets/hedgefavicon.png" alt="">
                    </div>
                    <h1>Journey to Hedgeheart</h1>
                </div>
            </div>
            <div id="hud-text">
                <div id="hud-best"></div>
                <div id="hud-message"></div>
            </div>
            <button id="hud-mute" aria-label="Sound on or off"></button>
            <button id="hud-button">Start game?</button>
        </div>
    </div>

    <div class="mobile-controls">
        <button id="left-btn">◀</button>
        <button id="jump-btn">▲</button>
        <button id="right-btn">▶</button>
    </div>

    <script type="module" src="platformer_v5.js"></script>
</body>

</html>
